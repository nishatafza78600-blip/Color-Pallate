<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Palette</title>
    <link href="./pallete.css" rel="stylesheet">
</head>
<body>
    <div class="container">
      <div class="text"><h1>Color Pallete</h1></div>
<div class="circles">
    <div class="bpal"></div>
    <div class="cpal"></div>
    <div class="dpal"></div>
    <div class="epal"></div>
    <div class="fpal"></div>
    <div class="gpal"></div>
    <div class="hpal"></div>
    <div class="ipal"></div>
    <div class="jpal"></div>
    <div class="kpal"></div>
    <div class="lpal"></div>
</div>

<div class="circles " style="margin-top: 50px;">
    <div class="bpal" style="background-color:rgb(3, 3, 91);"></div>
    <div class="cpal" style="background-color:rgb(4, 4, 132);"></div>
    <div class="dpal" style="background-color:rgb(4, 4, 187);"></div>
    <div class="epal" style="background-color:rgb(14, 14, 247);"></div>
    <div class="fpal" style="background-color:rgb(58, 58, 167);"></div>
    <div class="gpal" style="background-color:rgb(90, 90, 225);"></div>
    <div class="hpal" style="background-color:rgb(94, 94, 162);"></div>
    <div class="ipal" style="background-color:rgb(127, 127, 245);"></div>
    <div class="jpal" style="background-color:rgb(149, 149, 250);"></div>
    <div class="kpal" style="background-color:rgb(35, 127, 246);"></div>
    <div class="lpal" style="background-color:rgb(101, 164, 247);"></div>
</div>

<div class="circles" style="margin-top: 50px;">
    <div class="bpal" style="background-color: green;"></div>
    <div class="cpal" style="background-color: rgb(3, 166, 3);"></div>
    <div class="dpal" style="background-color: rgb(4, 201, 4);"></div>
    <div class="epal" style="background-color: rgb(19, 246, 19);"></div>
    <div class="fpal" style="background-color: rgb(73, 220, 73);"></div>
    <div class="gpal" style="background-color: rgb(72, 240, 72);"></div>
    <div class="hpal" style="background-color: rgb(169, 246, 169);"></div>
    <div class="ipal" style="background-color: rgb(144, 184, 144);"></div>
    <div class="jpal" style="background-color: rgb(182, 250, 115);"></div>
    <div class="kpal" style="background-color: rgb(186, 240, 186);"></div>
    <div class="lpal" style="background-color: rgb(202, 244, 202);"></div>
</div>
    
</div>
</body>
</html>
